name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: bash scripts/verify.sh
# TEMPLATE: React project/package-lock.json/npm scripts must exist before enabling this CI.
